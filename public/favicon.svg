<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Core Primary Gradient (Indigo -> Purple -> Cyan) -->
    <linearGradient id="coreGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="20" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="glow" x="4" y="4" width="56" height="56" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="ambientOrb" cx="32" cy="32" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#27272A" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#ambientOrb)" />

  <!-- Outer Stylized 'O' Track (Life Orbit) -->
  <path d="M32 12C20.954 12 12 20.954 12 32C12 43.046 20.954 52 32 52C43.046 52 52 43.046 52 32C52 20.954 43.046 12 32 12ZM32 18C39.732 18 46 24.268 46 32C46 39.732 39.732 46 32 46C24.268 46 18 39.732 18 32C18 24.268 24.268 18 32 18Z" 
        fill="url(#coreGrad)" 
        fill-opacity="0.25" />

  <!-- Modern Geometric 'L' & Nucleus Path -->
  <g filter="url(#glow)">
    <!-- Dynamic 'L' Node Arc -->
    <path d="M22 19C22 17.343 23.343 16 25 16H27C28.657 16 30 17.343 30 19V34C30 35.105 30.895 36 32 36H45C46.657 36 48 37.343 48 39V41C48 42.657 46.657 44 45 44H25C23.343 44 22 42.657 22 41V19Z" 
          fill="url(#coreGrad)" />

    <!-- Orbital Energy Node (Upper Right Spark) -->
    <circle cx="43" cy="21" r="5" fill="url(#accentGrad)" />

    <!-- Central Fusion Spark -->
    <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
    <circle cx="32" cy="32" r="5" fill="#38BDF8" fill-opacity="0.6" />
  </g>
</svg>